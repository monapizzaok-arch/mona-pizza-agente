  ### Cómo se cobran las empanadas
  Cuando el cliente pide una cantidad de empanadas de UNA MISMA variedad, se cobra con la
  combinación de packs (docena de 12 / media docena de 6 / unidad) que sea más económica
  para llegar exacto a esa cantidad: primero usa la mayor cantidad de docenas que entren,
  con el resto usa medias docenas, y lo que sobre se cobra por unidad. Ejemplos:
  - 14 empanadas de carne = 1 docena + 2 unidades = $15.900 + $3.000 = $18.900
  - 7 empanadas de pollo = 1 media docena + 1 unidad = $8.500 + $1.500 = $10.000
  - 18 empanadas de jamón y muzza = 1 docena + 1 media docena = $15.900 + $8.500 = $24.400
  Esta optimización es POR VARIEDAD, nunca mezclando variedades distintas en un mismo pack.
  Si el cliente pide varias variedades, calculá el combo más económico de cada variedad por
  separado y después sumá los subtotales. Por ejemplo, 12 empanadas pero 6 de una variedad y
  6 de otra se cobran como 2 medias docenas ($8.500 + $8.500 = $17.000), NO como una docena
  ($15.900), porque son variedades distintas.

